<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participant Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="logo" href="index.html">AGENTIC<span>EVENT</span></a></nav><section class="section"><h1>Participant Dashboard</h1><div id="rows" class="grid">Loading...</div></section><script src="js/config.js"></script><script>(async()=>{const id=localStorage.participantId;const r=await fetch(APP_CONFIG.API_BASE+"/registrations/participant/"+id);const x=await r.json();rows.innerHTML=x.map(a=>`<div class="panel"><h3>${a.event.title}</h3><p>${new Date(a.event.date).toDateString()}</p><p>Status: ${a.status}</p><p>Registration: ${a.registrationId}</p><p>Risk: ${a.riskLevel}</p></div>`).join("")})()</script></body></html>
