<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="css/style.css"></head><body><main class="form-wrap"><div class="form-card"><div class="event-badge">ADMIN CONTROL CENTER</div><h1>Admin sign in</h1><form id="f"><label>Email</label><input name="email" type="email" required><label>Password</label><input name="password" type="password" required><button class="btn">Sign in</button></form><p id="msg"></p></div></main><script src="js/config.js"></script><script>f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r=await fetch(APP_CONFIG.API_BASE+"/auth/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)return msg.textContent=j.message;localStorage.adminId=j.admin._id;location.href="admin-dashboard.html"}</script></body></html>
