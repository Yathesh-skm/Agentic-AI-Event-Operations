<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="form-wrap"><div class="form-card"><div class="event-badge">REGISTRATION AGENT</div><h1>Complete registration</h1><p>Choose an event. Your registration is checked for duplicate/fake-registration risk before confirmation.</p><select id="event"><option>Loading events...</option></select><button id="register" class="btn">Process registration</button><p id="msg"></p></div></main>
<script src="js/config.js"></script><script>
(async()=>{const events=await (await fetch(APP_CONFIG.API_BASE+"/events")).json();event.innerHTML=events.map(e=>`<option value="${e._id}">${e.title} — ${new Date(e.date).toLocaleDateString()}</option>`).join("");const q=new URLSearchParams(location.search).get("event");if(q)event.value=q})();
register.onclick=async()=>{try{const r=await fetch(APP_CONFIG.API_BASE+"/registrations",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({eventId:event.value,participantId:localStorage.participantId})});const j=await r.json();if(!r.ok)throw new Error(j.message);localStorage.registration=JSON.stringify(j);location.href="registration-success.html"}catch(e){msg.textContent=e.message;msg.className="error"}}
</script></body></html>
