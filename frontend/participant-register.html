<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participant Sign Up</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="form-wrap"><div class="form-card"><div class="event-badge">PARTICIPANT ACCOUNT</div><h1>Create account</h1><form id="f">
<label>Name</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Phone</label><input name="phone" required><label>Password</label><input name="password" type="password" required><label>Organization</label><input name="organization"><label>Age</label><input name="age" type="number"><label>City</label><input name="city"><button class="btn">Create account</button></form><p id="msg"></p></div></main>
<script src="js/config.js"></script><script>f.onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));const r=await fetch(APP_CONFIG.API_BASE+"/auth/participant/signup",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)return msg.textContent=j.message;localStorage.participantId=j.participant._id;location.href="participant-register-event.html"+location.search}</script></body></html>
