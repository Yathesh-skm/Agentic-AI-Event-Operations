<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="css/style.css"></head><body><nav><a class="logo" href="index.html">AGENTIC<span>EVENT</span></a></nav><section class="section"><div class="event-badge">EVENT INTELLIGENCE CENTER</div><h1>Operations dashboard</h1><div id="cards" class="grid"></div></section><script src="js/config.js"></script><script>(async()=>{const es=await(await fetch(APP_CONFIG.API_BASE+"/events")).json();cards.innerHTML=es.map(e=>`<div class="panel"><div class="event-badge">${e.category||"EVENT"}</div><h3>${e.title}</h3><p>Registrations: ${e.registrationCount}/${e.capacity}</p><p>Utilization: ${Math.round((e.registrationCount/e.capacity)*100)}%</p><p>Venue: ${e.venue?.name||"TBA"}</p></div>`).join("")})()</script></body></html>
