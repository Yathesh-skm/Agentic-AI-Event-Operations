<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registration Success</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="form-wrap"><div class="form-card" id="box"></div></main><script>
const j=JSON.parse(localStorage.registration||"{}");box.innerHTML=`<div class="event-badge">REGISTRATION AGENT</div><h1>${j.message||"Registration complete"}</h1><p>Registration ID: <b>${j.registration?.registrationId||"-"}</b></p><p>Status: <b>${j.registration?.status||"-"}</b></p>${j.qrImage?`<img src="${j.qrImage}" style="max-width:280px;background:white;padding:15px;border-radius:18px">`:""}<p>Email confirmation has been queued in the local MongoDB EmailLog collection.</p><a class="btn" href="index.html">Back home</a>`</script></body></html>
