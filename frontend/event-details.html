<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Details</title><link rel="stylesheet" href="css/style.css"></head>
<body><nav><a class="logo" href="index.html">AGENTIC<span>EVENT</span></a></nav><main class="form-wrap"><div id="details" class="panel">Loading...</div></main>
<script src="js/config.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get("id");const r=await fetch(APP_CONFIG.API_BASE+"/events/"+id);const e=await r.json();document.getElementById("details").innerHTML=`<div class="event-badge">${e.category||"EVENT"}</div><h1>${e.title}</h1><p>${e.description||""}</p><p>${new Date(e.date).toDateString()} · ${e.startTime||""}–${e.endTime||""}</p><p>${e.venue?.name||"Venue TBA"} · Capacity ${e.capacity}</p><p>${e.registrationCount||0} registrations</p><a class="btn" href="participant-login.html?event=${e._id}">Register for event</a>`})().catch(e=>document.getElementById("details").innerHTML=e.message)</script></body></html>
